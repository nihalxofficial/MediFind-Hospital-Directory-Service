<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Vibrant Blue-to-Cyan Gradient matching MediFind brand logo -->
    <linearGradient id="medifind-brand-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Soft Glow Drop Shadow -->
    <filter id="medifind-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2563eb" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Box -->
  <rect x="4" y="4" width="56" height="56" rx="16" ry="16" fill="url(#medifind-brand-grad)" filter="url(#medifind-shadow)" />
  
  <!-- Subtle Premium Border Highlight -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" ry="15.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Heart & Pulse Waveform Icon (Scaled & Centered) -->
  <g transform="translate(14, 14) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart Outline with subtle tint -->
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="rgba(255, 255, 255, 0.12)" />
    <!-- Pulse Waveform Line -->
    <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h4.27" />
  </g>

  <!-- Active Emerald Live Status Badge -->
  <circle cx="53" cy="11" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
</svg>
